<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi código QR</title>
<style>
:root { --bg: #f4f5f7; --card: #ffffff; --text: #16181d; --muted: #5f6672; --line: #e1e4e9; --accent: #0a0a0a; }
@media (prefers-color-scheme: dark) { :root { --bg: #111317; --card: #1b1e24; --text: #eef0f3; --muted: #a1a8b3; --line: #2c3038; --accent: #f2f2f2; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 480px; margin: 0 auto; padding: 16px; }
.tag { background: #fff; color: #16181d; border-radius: 18px; padding: 28px 24px; text-align: center; border: 1px solid var(--line); }
.tag h1 { margin: 0; font-size: 1.5rem; }
.tag p { margin: 6px 0 0; color: #5f6672; }
#qr { display: inline-block; margin: 20px 0 12px; padding: 12px; background: #fff; }
#qr img, #qr canvas { width: 240px; height: 240px; }
.tag strong { display: block; font-size: 1.1rem; color: #0a0a0a; }
.tools { margin-top: 18px; }
label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; }
input { width: 100%; font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; }
button { width: 100%; margin-top: 12px; border: 0; border-radius: 12px; padding: 14px; font: inherit; font-weight: 600; background: var(--accent); color: #fff; cursor: pointer; }
@media print { body { background: #fff; } .tools { display: none; } .tag { border: 2px solid #16181d; } }
</style>
</head>
<body>
<main>
  <div class="tag">
    <h1 id="name">Traslados</h1>
    <p id="vehicle"></p>
    <div id="qr"></div>
    <strong>Escanea, cotiza y reserva</strong>
    <p>Precio al instante con TAG y peajes incluidos</p>
  </div>
  <div class="tools">
    <label for="url">Dirección de tu página</label>
    <input id="url">
    <button id="save">Descargar imagen (para WhatsApp)</button>
    <button onclick="window.print()">Imprimir</button>
  </div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
import { CONFIG } from './config.js';
document.getElementById('name').textContent = CONFIG.nombre;
document.getElementById('vehicle').textContent = CONFIG.vehiculo;
const input = document.getElementById('url'), box = document.getElementById('qr');
input.value = new URL('./?qr', location.href).href;
const draw = () => { box.innerHTML = ''; new QRCode(box, { text: input.value.trim(), width: 480, height: 480, correctLevel: QRCode.CorrectLevel.M }); };
input.addEventListener('input', draw);
draw();
// A picture to send: the code with the name and a line of text under it, on white.
document.getElementById('save').onclick = () => {
  const qr = box.querySelector('canvas'), W = 600, c = document.createElement('canvas'), g = c.getContext('2d');
  c.width = W; c.height = 760;
  g.fillStyle = '#fff'; g.fillRect(0, 0, W, c.height);
  g.fillStyle = '#16181d'; g.textAlign = 'center';
  g.font = '700 38px system-ui, sans-serif'; g.fillText(CONFIG.nombre, W / 2, 64);
  g.font = '24px system-ui, sans-serif'; g.fillStyle = '#5f6672'; g.fillText(CONFIG.vehiculo, W / 2, 102);
  g.drawImage(qr, 80, 130, 440, 440);
  g.font = '700 30px system-ui, sans-serif'; g.fillStyle = '#0a0a0a'; g.fillText('Escanea, cotiza y reserva', W / 2, 630);
  g.font = '22px system-ui, sans-serif'; g.fillStyle = '#5f6672'; g.fillText('Precio al instante con TAG y peajes incluidos', W / 2, 670);
  const a = document.createElement('a');
  a.download = 'qr-traslados.png'; a.href = c.toDataURL('image/png'); a.click();
};
</script>
</body>
</html>
